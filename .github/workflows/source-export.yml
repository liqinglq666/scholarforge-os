name: Source Export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Archive source
        run: tar --exclude=.git -czf "$RUNNER_TEMP/scholarforge-source.tar.gz" .
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: scholarforge-source
          path: ${{ runner.temp }}/scholarforge-source.tar.gz
          retention-days: 1
