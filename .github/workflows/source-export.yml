          5d5f540f58adb9f2abf480bf2688057308d3f216192308b7425b15e91d933224  .github/refactor-b64/part-05-47
          a72767ece0329cfdd4bca14f3c4f0d6a462464eb6c1c61a17a50c4c0f63a8d77  .github/refactor-b64/part-05-48
          3d9cdaa07923cb3e4330f88c9b331586cacc7bfebf52fed7ead444a03957c541  .github/refactor-b64/part-05-49
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/chunks.sha256"
          sha256sum -c "$RUNNER_TEMP/chunks.sha256"

      - name: Rebuild and verify patch
        run: |
          cat \
            .github/refactor-binary/part-00 \
            .github/refactor-binary/part-01 \
            .github/refactor-binary/part-02 \
            .github/refactor-binary/part-03 \
            .github/refactor-binary/part-04 \
            > "$RUNNER_TEMP/refactor.patch.gz"
          cat .github/refactor-b64/part-05-* | base64 -d >> "$RUNNER_TEMP/refactor.patch.gz"
          cat \
            .github/refactor-binary/part-06 \
            .github/refactor-binary/part-07 \
            >> "$RUNNER_TEMP/refactor.patch.gz"
          gzip -dc "$RUNNER_TEMP/refactor.patch.gz" > "$RUNNER_TEMP/refactor.patch"
          echo 'ce717f9a6e197bf0c8aa7c35f174339fddfa229dabcbeeef79ad78487d096778  '"$RUNNER_TEMP/refactor.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/refactor.patch"

      - name: Apply structural refactor
        run: |
          git apply "$RUNNER_TEMP/refactor.patch"
          rm -rf .github/refactor-binary .github/refactor-b64 .github/patch .github/patch-text .github/refactor-patch
          rm -f .github/workflows/source-export.yml

      - name: Commit verified source
        run: |
          git config user.name 'scholarforge-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: unify multi-project research workflows'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
