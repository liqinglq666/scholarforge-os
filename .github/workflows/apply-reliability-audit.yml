name: Apply reliability audit fixes

on:
  push:
    branches:
      - agent/scholarforge-v1-5-redesign

permissions:
  contents: write

concurrency:
  group: reliability-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Apply reliability fixes
        run: |
          python maintenance/fix_part_1.py
          python maintenance/fix_part_2.py
          python maintenance/fix_part_3.py
          python maintenance/fix_part_4.py
          rm -f maintenance/fix_part_*.py
          rm -f .github/workflows/apply-reliability-audit.yml
          rm -f x

      - name: Install dependencies
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm run test

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit fixes
        run: |
          git config user.name "ScholarForge Maintenance"
          git config user.email "206194366+liqinglq666@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden document workflow and local state"
          git push origin HEAD:agent/scholarforge-v1-5-redesign
