name: Apply ScholarForge UX Rebuild

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply staged frontend rebuild
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ux-patch-*.b64 | base64 --decode > /tmp/scholarforge-ux-rebuild.tgz
          tar -xzf /tmp/scholarforge-ux-rebuild.tgz -C .
          rm -f .github/ux-patch-*.b64

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm run test

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit validated rebuild
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: rebuild frontend around the author workflow"
          git push origin HEAD:"${TARGET_BRANCH}"
