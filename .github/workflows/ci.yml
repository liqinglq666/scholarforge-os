name: ScholarForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Apply pending reliability patch
        run: |
          if [ -f maintenance/fix_part_5.py ]; then
            python maintenance/fix_part_5.py
            rm -f maintenance/fix_part_5.py
            rm -f .github/workflows/apply-final-reliability.yml
            git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          fi

      - name: Install dependencies
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm run test

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit audited fixes
        run: |
          if ! git diff --quiet; then
            git config user.name "ScholarForge Maintenance"
            git config user.email "206194366+liqinglq666@users.noreply.github.com"
            git add -A
            git commit -m "fix: close remaining workflow edge cases"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
