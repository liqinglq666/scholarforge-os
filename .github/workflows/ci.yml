name: ScholarForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm run test

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Create source snapshot
        if: always()
        run: tar --exclude=.git --exclude=node_modules --exclude=.next -czf scholarforge-current-source.tgz .

      - name: Upload source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scholarforge-current-source
          path: scholarforge-current-source.tgz
          retention-days: 1
