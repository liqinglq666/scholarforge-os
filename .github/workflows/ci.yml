name: Diagnose ScholarForge UX Payload

on:
  pull_request:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Verify payload chunks
        shell: bash
        run: |
          set -euo pipefail
          wc -c .github/ux-patch-*.b64
          sha256sum .github/ux-patch-*.b64
          cat .github/ux-patch-*.b64 > /tmp/all.b64
          wc -c /tmp/all.b64
          sha256sum /tmp/all.b64
          base64 --decode /tmp/all.b64 > /tmp/rebuild.tgz
          wc -c /tmp/rebuild.tgz
          sha256sum /tmp/rebuild.tgz
          gzip -t /tmp/rebuild.tgz
