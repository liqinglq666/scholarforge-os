name: ScholarForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Package git review snapshot
        run: tar -czf /tmp/scholarforge-git-source.tgz .

      - name: Upload git review snapshot
        uses: actions/upload-artifact@v4
        with:
          name: scholarforge-git-source-${{ github.sha }}
          path: /tmp/scholarforge-git-source.tgz
          retention-days: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build
