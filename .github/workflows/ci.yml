name: Apply ScholarForge Scope Reduction

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply staged scope reduction
        shell: bash
        run: |
          set -euo pipefail
          cat .github/scope-patch-*.b64 | base64 --decode > /tmp/scope-reduction.tgz
          echo "3d9eb064888527820ee5e19259bda50b335d56a6a4043e3690ea421ffd66e624  /tmp/scope-reduction.tgz" | sha256sum -c -
          tar -xzf /tmp/scope-reduction.tgz -C .
          rm -f .github/scope-patch-*.b64
          git checkout HEAD -- .github/workflows/ci.yml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm run test

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit validated scope reduction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove unreliable product scope"
          git push origin HEAD:"${TARGET_BRANCH}"
