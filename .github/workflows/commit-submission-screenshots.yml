name: Commit submission screenshots

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  capture-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Skip after screenshot commit
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -q '^docs: add current submission screenshots$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.guard.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      - name: Capture current production workspace
        if: steps.guard.outputs.skip != 'true'
        env:
          BASE_URL: https://scholarforge-os.vercel.app
        run: |
          mkdir -p submission-screenshots docs/assets/submission
          node scripts/capture-submission-screenshots.mjs
          cp submission-screenshots/*.png docs/assets/submission/

      - name: Commit screenshots to branch
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/submission/*.png
          if git diff --cached --quiet; then
            echo "Screenshots already match the current production UI."
            exit 0
          fi
          git commit -m "docs: add current submission screenshots"
          git push origin "HEAD:${{ github.head_ref }}"
