name: Capture submission screenshots

on:
  push:
    branches:
      - ops/capture-submission-screenshots

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture current production workspace
        env:
          BASE_URL: https://scholarforge-os.vercel.app
        run: |
          mkdir -p submission-screenshots
          cat > /tmp/capture-submission.mjs <<'EOF'
          import { chromium } from 'playwright';

          const baseURL = process.env.BASE_URL;
          const browser = await chromium.launch();
          const context = await browser.newContext({
            viewport: { width: 1440, height: 1100 },
            deviceScaleFactor: 1,
            locale: 'zh-CN',
            colorScheme: 'light',
          });
          const page = await context.newPage();

          await page.route('**/api/health', (route) => route.fulfill({
            status: 200,
            contentType: 'application/json',
            body: JSON.stringify({
              configured: true,
              model: 'qwen-plus',
              message: '分析服务已配置。',
              limits: {
                maxCharacters: 12000,
                maxRequestBytes: 80000,
                requestsPerWindow: 8,
                windowMinutes: 10,
              },
            }),
          }));

          await page.route('**/api/review', async (route) => {
            const posted = route.request().postDataJSON();
            const original = 'The results can well prove that the pore structure became much denser after 28 d of curing. The total porosity decreased from 18.6% to 14.2%, and the compressive strength increased from 42.5 MPa to 51.3 MPa. Therefore, the additive completely eliminated the harmful pores in the matrix.';
            const revised = 'The results indicate that the pore structure became denser after 28 d of curing. The total porosity decreased from 18.6% to 14.2%, and the compressive strength increased from 42.5 MPa to 51.3 MPa. These observations suggest that the additive reduced the proportion of harmful pores in the matrix.';
            await route.fulfill({
              status: 200,
              contentType: 'application/json',
              body: JSON.stringify({
                requestId: 'submission-screenshot',
                result: {
                  id: 'submission-result',
                  taskId: posted.taskId,
                  summary: '发现 3 处需要作者核对的表达风险，其中结论强度与研究范围需要优先处理。',
                  suggestedText: revised,
                  warnings: [],
                  safetyGate: {
                    status: 'passed',
                    blockedCount: 0,
                    reviewCount: 1,
                    checkedAt: new Date().toISOString(),
                    checks: [
                      {
                        id: 'numbers',
                        title: '数值与单位',
                        state: 'passed',
                        summary: '已核对 28 d、18.6%、14.2%、42.5 MPa 与 51.3 MPa。',
                        evidence: ['28 d', '18.6%', '14.2%', '42.5 MPa', '51.3 MPa'],
                      },
                      {
                        id: 'terminology',
                        title: '术语与引用',
                        state: 'passed',
                        summary: '受保护术语与引用未发生变化。',
                        evidence: ['pore structure', 'compressive strength'],
                      },
                      {
                        id: 'claim-boundary',
                        title: '因果、结论强度与研究范围',
                        state: 'review',
                        summary: '“prove” 与 “completely eliminated” 超出当前证据边界，已降级为谨慎表述。',
                        evidence: ['can well prove', 'completely eliminated'],
                      },
                    ],
                  },
                  generatedAt: new Date().toISOString(),
                  issues: [
                    {
                      id: 'issue-certainty',
                      category: '结论强度',
                      severity: 'major',
                      location: '第 1 句',
                      original: 'can well prove',
                      revised: 'indicate',
                      reason: '“prove” 将结果表述为确定性证明，超过当前实验结果能够支持的证据强度。',
                      meaningChanged: false,
                      authorActionRequired: false,
                      safeToApply: true,
                    },
                    {
                      id: 'issue-scope',
                      category: '研究范围',
                      severity: 'major',
                      location: '第 3 句',
                      original: 'completely eliminated the harmful pores',
                      revised: 'reduced the proportion of harmful pores',
                      reason: '“完全消除”属于过度外推，应改为与孔隙率结果一致的谨慎结论。',
                      meaningChanged: true,
                      authorActionRequired: true,
                      safeToApply: false,
                    },
                    {
                      id: 'issue-style',
                      category: '学术表达',
                      severity: 'minor',
                      location: '第 1 句',
                      original: 'became much denser',
                      revised: 'became denser',
                      reason: '删除缺少量化依据的程度副词，使表达更克制。',
                      meaningChanged: false,
                      authorActionRequired: false,
                      safeToApply: true,
                    },
                  ],
                },
              }),
            });
          });

          const waitForWorkspace = async () => {
            await page.waitForSelector('#source-text', { state: 'visible', timeout: 30000 });
            await page.waitForFunction(() => document.fonts?.status === 'loaded');
            await page.waitForTimeout(700);
          };

          await page.goto(`${baseURL}/workspace?example=materials-polish`, { waitUntil: 'networkidle' });
          await waitForWorkspace();
          await page.screenshot({
            path: 'submission-screenshots/01-workspace-overview.png',
            fullPage: true,
            animations: 'disabled',
          });

          await page.locator('.quick-task-switcher label').filter({ hasText: '科研中译英' }).click();
          await page.waitForFunction(() => document.querySelector('#source-text')?.value.includes('养护28 d后'));
          await page.waitForTimeout(500);
          await page.screenshot({
            path: 'submission-screenshots/02-task-switching.png',
            fullPage: true,
            animations: 'disabled',
          });

          await page.locator('.quick-task-switcher label').filter({ hasText: '英文保守润色' }).click();
          await page.waitForFunction(() => document.querySelector('#source-text')?.value.includes('The results can well prove'));
          await page.getByRole('button', { name: '检查并开始分析', exact: true }).click();
          await page.getByRole('heading', { name: '确认发送当前文本？' }).waitFor({ state: 'visible' });
          await page.screenshot({
            path: 'submission-screenshots/03-analysis-confirmation.png',
            fullPage: false,
            animations: 'disabled',
          });

          await page.getByRole('button', { name: '确认并开始分析', exact: true }).click();
          await page.getByRole('heading', { name: '候选稿通过当前自动规则' }).waitFor({ state: 'visible', timeout: 30000 });
          await page.waitForTimeout(700);
          await page.screenshot({
            path: 'submission-screenshots/04-safety-gate-review.png',
            fullPage: true,
            animations: 'disabled',
          });

          const accepted = page.getByRole('button', { name: '已接受', exact: true }).first();
          if (await accepted.isVisible()) {
            await accepted.click();
          }
          const apply = page.getByRole('button', { name: '应用这一条建议' }).first();
          if (await apply.isVisible() && await apply.isEnabled()) {
            await apply.click();
          }
          await page.getByRole('button', { name: '进入导出' }).click();
          await page.getByRole('heading', { name: '选择需要的交付文件' }).waitFor({ state: 'visible' });
          await page.waitForTimeout(500);
          await page.screenshot({
            path: 'submission-screenshots/05-export-deliverables.png',
            fullPage: true,
            animations: 'disabled',
          });

          await browser.close();
          EOF
          node /tmp/capture-submission.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: submission-screenshots
          path: submission-screenshots/*.png
          if-no-files-found: error
          retention-days: 7
