name: Capture submission screenshots on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture current production workspace
        env:
          BASE_URL: https://scholarforge-os.vercel.app
        run: |
          mkdir -p submission-screenshots
          node scripts/capture-submission-screenshots.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: submission-screenshots
          path: submission-screenshots/*.png
          if-no-files-found: error
          retention-days: 7
