<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ScholarForge OS 科研事实安全审校工作台</title>
  <desc id="desc">展示论文输入、科研事实安全门和作者决策三层工作流。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAF9"/>
      <stop offset="1" stop-color="#EEF4F1"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F5A50"/>
      <stop offset="1" stop-color="#123B38"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#102A28" flood-opacity="0.12"/>
    </filter>
    <style>
      .sans{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
      .serif{font-family:Georgia,"Noto Serif SC","Songti SC",serif}
      .muted{fill:#5D6B69}
      .dark{fill:#102321}
      .green{fill:#0F5A50}
      .small{font-size:14px}
      .body{font-size:18px}
      .label{font-size:15px;font-weight:700;letter-spacing:.08em}
      .title{font-size:38px;font-weight:800}
      .h2{font-size:24px;font-weight:800}
      .h3{font-size:18px;font-weight:800}
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1090" cy="-20" r="210" fill="#DDEDE7" opacity=".65"/>
  <circle cx="70" cy="700" r="190" fill="#E7EFEA" opacity=".9"/>

  <g class="sans">
    <g transform="translate(58 42)">
      <rect width="50" height="50" rx="14" fill="url(#brand)"/>
      <text x="25" y="31" text-anchor="middle" fill="#fff" font-size="18" font-weight="800">SF</text>
      <text x="68" y="21" class="dark h2">ScholarForge OS｜研语工坊</text>
      <text x="68" y="45" class="muted body">科研事实安全审校工作台 · The model proposes · Code verifies · The author decides</text>
    </g>

    <g transform="translate(58 128)">
      <rect width="1084" height="478" rx="26" fill="#FFFFFF" stroke="#D6E2DE" filter="url(#shadow)"/>

      <g transform="translate(28 28)">
        <rect width="310" height="422" rx="18" fill="#FBFCFB" stroke="#DCE5E2"/>
        <text x="24" y="34" class="green label">01 · 作者输入</text>
        <text x="24" y="68" class="dark h2">论文文本与任务设置</text>
        <g transform="translate(24 88)">
          <rect width="262" height="208" rx="14" fill="#FFFDF8" stroke="#C9D6D2"/>
          <text x="18" y="34" class="muted small">Results · Construction and Building Materials</text>
          <text x="18" y="72" class="dark serif" font-size="17">The total porosity decreased</text>
          <text x="18" y="100" class="dark serif" font-size="17">from 18.6% to 14.2%, while</text>
          <text x="18" y="128" class="dark serif" font-size="17">compressive strength increased</text>
          <text x="18" y="156" class="dark serif" font-size="17">from 42.5 MPa to 51.3 MPa.</text>
          <rect x="18" y="178" width="150" height="7" rx="4" fill="#D7E4DF"/>
          <rect x="18" y="178" width="92" height="7" rx="4" fill="#0F5A50"/>
        </g>
        <g transform="translate(24 314)">
          <rect width="126" height="38" rx="10" fill="#E6F2EE"/>
          <text x="63" y="24" text-anchor="middle" class="green small" font-weight="700">英文保守润色</text>
          <rect x="136" width="126" height="38" rx="10" fill="#F2F4F3"/>
          <text x="199" y="24" text-anchor="middle" class="muted small" font-weight="700">投稿前检查</text>
        </g>
        <text x="24" y="390" class="muted small">支持：粘贴文本 · DOCX 导入 · 术语锁定</text>
      </g>

      <path d="M356 239 H398" stroke="#8FB8AD" stroke-width="3" stroke-linecap="round"/>
      <path d="M390 231 L402 239 L390 247" fill="none" stroke="#8FB8AD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <g transform="translate(398 28)">
        <rect width="310" height="422" rx="18" fill="#F5FAF8" stroke="#B9D5CC"/>
        <text x="24" y="34" class="green label">02 · 独立验证</text>
        <text x="24" y="68" class="dark h2">ScholarForge Safety Gate</text>
        <g transform="translate(24 92)">
          <g>
            <circle cx="12" cy="12" r="12" fill="#DCEFE9"/><text x="12" y="17" text-anchor="middle" class="green small" font-weight="800">✓</text>
            <text x="36" y="17" class="dark body">数值与单位保持一致</text>
          </g>
          <g transform="translate(0 48)">
            <circle cx="12" cy="12" r="12" fill="#DCEFE9"/><text x="12" y="17" text-anchor="middle" class="green small" font-weight="800">✓</text>
            <text x="36" y="17" class="dark body">引用与受保护术语</text>
          </g>
          <g transform="translate(0 96)">
            <circle cx="12" cy="12" r="12" fill="#FFF1D9"/><text x="12" y="17" text-anchor="middle" fill="#A86710" class="small" font-weight="800">!</text>
            <text x="36" y="17" class="dark body">结论强度升级风险</text>
          </g>
          <g transform="translate(0 144)">
            <circle cx="12" cy="12" r="12" fill="#FCE7E7"/><text x="12" y="17" text-anchor="middle" fill="#A44343" class="small" font-weight="800">×</text>
            <text x="36" y="17" class="dark body">新增实验声明已阻断</text>
          </g>
        </g>
        <rect x="24" y="300" width="262" height="74" rx="14" fill="#123B38"/>
        <text x="42" y="328" fill="#BFE4D9" class="small" font-weight="700">QUARANTINED / PASSED</text>
        <text x="42" y="354" fill="#FFFFFF" class="body" font-weight="700">模型不能自行宣布“安全”</text>
        <text x="24" y="402" class="muted small">代码独立检查：因果 · 确定性 · 研究范围</text>
      </g>

      <path d="M726 239 H768" stroke="#8FB8AD" stroke-width="3" stroke-linecap="round"/>
      <path d="M760 231 L772 239 L760 247" fill="none" stroke="#8FB8AD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <g transform="translate(768 28)">
        <rect width="288" height="422" rx="18" fill="#FBFCFB" stroke="#DCE5E2"/>
        <text x="24" y="34" class="green label">03 · 作者决策</text>
        <text x="24" y="68" class="dark h2">逐条核对与安全应用</text>
        <g transform="translate(24 94)">
          <rect width="240" height="84" rx="14" fill="#FFFFFF" stroke="#D7E1DE"/>
          <text x="16" y="27" class="dark h3">Issue 01 · 结论过强</text>
          <text x="16" y="54" class="muted small">prove → suggest / indicate</text>
          <rect x="16" y="64" width="72" height="6" rx="3" fill="#0F5A50"/>
        </g>
        <g transform="translate(24 194)">
          <rect width="72" height="40" rx="11" fill="#0F5A50"/>
          <text x="36" y="25" text-anchor="middle" fill="#fff" class="small" font-weight="800">接受</text>
          <rect x="84" width="72" height="40" rx="11" fill="#F0F3F2"/>
          <text x="120" y="25" text-anchor="middle" class="dark small" font-weight="800">拒绝</text>
          <rect x="168" width="72" height="40" rx="11" fill="#FFF3DC"/>
          <text x="204" y="25" text-anchor="middle" fill="#8B5B12" class="small" font-weight="800">暂缓</text>
        </g>
        <g transform="translate(24 256)">
          <rect width="240" height="58" rx="14" fill="#E7F2EE"/>
          <text x="20" y="24" class="green small" font-weight="800">唯一锚点 · 不跨段落 · 无重叠</text>
          <text x="20" y="44" class="muted small">满足规则后才允许局部应用</text>
        </g>
        <g transform="translate(24 334)">
          <text x="0" y="16" class="dark small" font-weight="700">撤销 / 重做 / 历史 / 备份 / 导出</text>
          <text x="0" y="44" class="muted small">TXT · Markdown · Clean DOCX · JSON</text>
        </g>
      </g>
    </g>

    <g transform="translate(58 630)">
      <rect width="1084" height="1" fill="#D4E1DD"/>
      <text x="0" y="28" class="muted small">在线体验：scholarforge-os.vercel.app/try</text>
      <text x="1084" y="28" text-anchor="end" class="green small" font-weight="800">科研事实安全门通过 ≠ 科学正确，最终责任始终属于作者</text>
    </g>
  </g>
</svg>
