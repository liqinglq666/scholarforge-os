<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">ScholarForge OS workflow runtime</title>
  <desc id="desc">The review request fans out to four agents, converges into deterministic aggregation, then produces a decision and artifacts.</desc>
  <rect width="1200" height="620" rx="28" fill="#F7F4ED"/>
  <text x="60" y="68" font-family="Arial, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#17233D">并行审校工作流</text>
  <text x="60" y="100" font-family="Arial, PingFang SC, sans-serif" font-size="15" fill="#68728A">模型负责专业判断，代码负责汇总、评分和决策一致性</text>
  <g font-family="Arial, PingFang SC, sans-serif">
    <rect x="60" y="235" width="170" height="100" rx="20" fill="#17233D"/>
    <text x="93" y="273" font-size="13" font-weight="700" fill="#F6B08E">START</text>
    <text x="93" y="305" font-size="18" font-weight="700" fill="#FFFDF8">审校请求</text>

    <g fill="#FFFDF8" stroke="#D8D4CB">
      <rect x="320" y="115" width="190" height="90" rx="18"/>
      <rect x="320" y="225" width="190" height="90" rx="18"/>
      <rect x="320" y="335" width="190" height="90" rx="18"/>
      <rect x="320" y="445" width="190" height="90" rx="18"/>
    </g>
    <g font-size="16" font-weight="700" fill="#17233D">
      <text x="350" y="168">Terminology</text>
      <text x="350" y="278">Language</text>
      <text x="350" y="388">Logic</text>
      <text x="350" y="498">Method</text>
    </g>
    <g font-size="12" fill="#68728A">
      <text x="350" y="190">独立百炼调用</text>
      <text x="350" y="300">独立百炼调用</text>
      <text x="350" y="410">独立百炼调用</text>
      <text x="350" y="520">独立百炼调用</text>
    </g>

    <rect x="620" y="205" width="230" height="160" rx="22" fill="#FFFDF8" stroke="#D8D4CB"/>
    <text x="652" y="245" font-size="13" font-weight="700" fill="#EF8058">AGGREGATOR</text>
    <text x="652" y="278" font-size="19" font-weight="700" fill="#17233D">确定性聚合</text>
    <text x="652" y="310" font-size="14" fill="#68728A">去重 · 规范化 · 风险校验</text>
    <text x="652" y="335" font-size="14" fill="#68728A">评分 · Decision 规则</text>

    <rect x="950" y="150" width="190" height="110" rx="20" fill="#E8F4EF" stroke="#A9D5C3"/>
    <text x="980" y="190" font-size="13" font-weight="700" fill="#2F8C6B">DECISION</text>
    <text x="980" y="224" font-size="18" font-weight="700" fill="#17233D">投稿准备度</text>

    <rect x="950" y="320" width="190" height="110" rx="20" fill="#FFF0E8" stroke="#F1BDA5"/>
    <text x="980" y="360" font-size="13" font-weight="700" fill="#EF8058">ARTIFACTS</text>
    <text x="980" y="394" font-size="18" font-weight="700" fill="#17233D">TXT · MD · JSON</text>
  </g>
  <g fill="none" stroke="#EF8058" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M230 285h45V160h45"/>
    <path d="M230 285h90"/>
    <path d="M230 285h45v95h45"/>
    <path d="M230 285h45v205h45"/>
    <path d="M510 160h55v70h55"/>
    <path d="M510 270h110"/>
    <path d="M510 380h55v-70h55"/>
    <path d="M510 490h55V340h55"/>
    <path d="M850 285h45V205h55"/>
    <path d="M850 285h45v90h55"/>
  </g>
</svg>
