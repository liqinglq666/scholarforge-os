<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ScholarForge OS system architecture</title>
  <desc id="desc">Layered architecture covering browser UI, Next.js API, parallel orchestration, Model Studio agents, and artifact generation.</desc>
  <rect width="1200" height="720" rx="28" fill="#F7F4ED"/>
  <text x="60" y="68" font-family="Arial, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#17233D">系统整体架构</text>
  <text x="60" y="100" font-family="Arial, PingFang SC, sans-serif" font-size="15" fill="#68728A">Vercel 上的 Next.js 全栈应用，通过服务端并行调用阿里云百炼</text>
  <g font-family="Arial, PingFang SC, sans-serif">
    <rect x="80" y="140" width="1040" height="90" rx="20" fill="#FFFDF8" stroke="#D8D4CB"/>
    <text x="110" y="176" font-size="13" font-weight="700" fill="#EF8058">CLIENT LAYER</text>
    <text x="110" y="207" font-size="20" font-weight="700" fill="#17233D">Browser Workspace · 对照审校 · 问题中心 · 术语库 · 运行轨迹 · 下载交付物</text>

    <rect x="80" y="260" width="1040" height="90" rx="20" fill="#FFFDF8" stroke="#D8D4CB"/>
    <text x="110" y="296" font-size="13" font-weight="700" fill="#EF8058">APPLICATION LAYER</text>
    <text x="110" y="327" font-size="20" font-weight="700" fill="#17233D">Next.js 16 · Route Handlers · 输入校验 · 健康检查 · 错误降级</text>

    <rect x="80" y="380" width="1040" height="120" rx="20" fill="#17233D"/>
    <text x="110" y="416" font-size="13" font-weight="700" fill="#F6B08E">ORCHESTRATION LAYER</text>
    <text x="110" y="449" font-size="20" font-weight="700" fill="#FFFDF8">Promise.all 并行调度 · 输出标准化 · 问题去重 · 术语去重 · 评分校准 · 决策规则</text>
    <text x="110" y="478" font-size="14" fill="#CBD3E3">失败 Agent 可被隔离；全部失败时返回可诊断错误；模型不直接决定最终分数</text>

    <g>
      <rect x="80" y="530" width="235" height="120" rx="20" fill="#E8F4EF" stroke="#A9D5C3"/>
      <text x="105" y="565" font-size="13" font-weight="700" fill="#2F8C6B">TERMINOLOGY AGENT</text>
      <text x="105" y="596" font-size="16" font-weight="700" fill="#17233D">术语、缩写、单位</text>
      <text x="105" y="624" font-size="13" fill="#68728A">独立 qwen-plus 调用</text>

      <rect x="340" y="530" width="235" height="120" rx="20" fill="#E8F4EF" stroke="#A9D5C3"/>
      <text x="365" y="565" font-size="13" font-weight="700" fill="#2F8C6B">LANGUAGE AGENT</text>
      <text x="365" y="596" font-size="16" font-weight="700" fill="#17233D">语法、语气、可读性</text>
      <text x="365" y="624" font-size="13" fill="#68728A">独立 qwen-plus 调用</text>

      <rect x="600" y="530" width="235" height="120" rx="20" fill="#E8F4EF" stroke="#A9D5C3"/>
      <text x="625" y="565" font-size="13" font-weight="700" fill="#2F8C6B">LOGIC AGENT</text>
      <text x="625" y="596" font-size="16" font-weight="700" fill="#17233D">因果、证据边界</text>
      <text x="625" y="624" font-size="13" fill="#68728A">独立 qwen-plus 调用</text>

      <rect x="860" y="530" width="260" height="120" rx="20" fill="#E8F4EF" stroke="#A9D5C3"/>
      <text x="885" y="565" font-size="13" font-weight="700" fill="#2F8C6B">METHOD AGENT</text>
      <text x="885" y="596" font-size="16" font-weight="700" fill="#17233D">复现性与报告完整性</text>
      <text x="885" y="624" font-size="13" fill="#68728A">独立 qwen-plus 调用</text>
    </g>
  </g>
  <g stroke="#EF8058" stroke-width="4" stroke-linecap="round">
    <path d="M600 230v28"/>
    <path d="M600 350v28"/>
    <path d="M600 500v28"/>
  </g>
</svg>
